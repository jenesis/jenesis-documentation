# What the poms configure on maven-surefire-plugin and Jenesis does not read from a plugin block:
# excludedGroups slow,optional and the exclusion of **/perf/**.
jenesis.test.tag=-slow+-optional
jenesis.test.exclude=org[.]jgrapht[.]perf[.].*
# GonAlgorithmTest opens a test resource as a java.io.File, which needs folders rather than the module's jar.
jenesis.test.jars=false

# The module whose tests read src/test/resources relative to the folder they run in.
jenesis.process.directory=maven-resolver-impl
# Tests of other modules that need their own folder, Maven's target/classes, a file a Maven plugin generates or a
# live repository.
jenesis.test.exclude=maven-resolver-api/.*KeysTest,maven-resolver-generator-gnupg/.*GpgSignerFactoryTest,maven-resolver-transport-wagon/.*PlexusSupportTest,.*RepositorySystemSupplierTest,.*(Apache|Jdk|Jetty|Url)TransporterTest

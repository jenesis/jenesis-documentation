# How the Java modules and Maven artifacts named after jenesis.build are published.
# Every module below jenesis.build is attached as a jar to the GitHub releases of its project, and is the Maven
# artifact of the same name in the group build.jenesis, whose POM is attached to the same releases. The build tool
# is released from jenesis/jenesis, the launcher from jenesis/jenesis-launcher and the crawler from
# jenesis/jenesis-modules. GitHub's releases/latest redirects to the newest release, which names the newest
# version. The releases hold no snapshots.
module=https://github.com/jenesis/jenesis/releases/download/v{version}/{module}-{version}{-classifier}.{type}
module.latest=https://github.com/jenesis/jenesis/releases/latest/download/{module}.jar
module.suffixes=none
module[build.jenesis.launcher]=https://github.com/jenesis/jenesis-launcher/releases/download/v{version}/{module}-{version}{-classifier}.{type}
module[build.jenesis.launcher].latest=https://github.com/jenesis/jenesis-launcher/releases/latest/download/{module}.jar
module[build.jenesis.launcher].suffixes=none
module[build.jenesis.crawler]=https://github.com/jenesis/jenesis-modules/releases/download/v{version}/{module}-{version}{-classifier}.{type}
module[build.jenesis.crawler].latest=https://github.com/jenesis/jenesis-modules/releases/latest/download/{module}.jar
module[build.jenesis.crawler].suffixes=none
moduletomaven=build.jenesis:{module}
maven=https://github.com/jenesis/jenesis/releases/download/v{version}/{artifactId}-{version}{-classifier}.{type}
maven.latest=https://github.com/jenesis/jenesis/releases/latest/download/{artifactId}.pom
maven.suffixes=none
maven[build.jenesis.launcher]=https://github.com/jenesis/jenesis-launcher/releases/download/v{version}/{artifactId}-{version}{-classifier}.{type}
maven[build.jenesis.launcher].latest=https://github.com/jenesis/jenesis-launcher/releases/latest/download/{artifactId}.pom
maven[build.jenesis.launcher].suffixes=none
maven[build.jenesis.crawler]=https://github.com/jenesis/jenesis-modules/releases/download/v{version}/{artifactId}-{version}{-classifier}.{type}
maven[build.jenesis.crawler].latest=https://github.com/jenesis/jenesis-modules/releases/latest/download/{artifactId}.pom
maven[build.jenesis.crawler].suffixes=none

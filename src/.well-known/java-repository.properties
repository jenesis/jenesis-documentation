# How the Java modules and Maven artifacts named after jenesis.build are published.
# Every module below jenesis.build is the Maven artifact of the same name in the group build.jenesis. The build tool,
# the launcher, the crawler and Jenesis Repository, whose modules are all named build.jenesis.repository.*, attach
# the jar and the POM of each module to the GitHub releases of their own repositories, whose releases/latest
# redirects to the newest release and so names the newest version; the releases hold no snapshots. The sources of
# every release are the archive GitHub keeps of its tag.
moduletomaven=build.jenesis:{module}
module[build.jenesis]=https://github.com/jenesis/jenesis/releases/download/v{version}/{module}-{version}{-classifier}.{type}
module[build.jenesis].latest=https://github.com/jenesis/jenesis/releases/latest/download/{module}.jar
module[build.jenesis].suffixes=none
maven[build.jenesis]=https://github.com/jenesis/jenesis/releases/download/v{version}/{artifactId}-{version}{-classifier}.{type}
maven[build.jenesis].latest=https://github.com/jenesis/jenesis/releases/latest/download/{artifactId}.pom
maven[build.jenesis].suffixes=none
sources[build.jenesis]=https://github.com/jenesis/jenesis/archive/refs/tags/v{version}.zip
module[build.jenesis.launcher]=https://github.com/jenesis/jenesis-launcher/releases/download/v{version}/{module}-{version}{-classifier}.{type}
module[build.jenesis.launcher].latest=https://github.com/jenesis/jenesis-launcher/releases/latest/download/{module}.jar
module[build.jenesis.launcher].suffixes=none
maven[build.jenesis.launcher]=https://github.com/jenesis/jenesis-launcher/releases/download/v{version}/{artifactId}-{version}{-classifier}.{type}
maven[build.jenesis.launcher].latest=https://github.com/jenesis/jenesis-launcher/releases/latest/download/{artifactId}.pom
maven[build.jenesis.launcher].suffixes=none
sources[build.jenesis.launcher]=https://github.com/jenesis/jenesis-launcher/archive/refs/tags/v{version}.zip
module[build.jenesis.crawler]=https://github.com/jenesis/jenesis-modules/releases/download/v{version}/{module}-{version}{-classifier}.{type}
module[build.jenesis.crawler].latest=https://github.com/jenesis/jenesis-modules/releases/latest/download/{module}.jar
module[build.jenesis.crawler].suffixes=none
maven[build.jenesis.crawler]=https://github.com/jenesis/jenesis-modules/releases/download/v{version}/{artifactId}-{version}{-classifier}.{type}
maven[build.jenesis.crawler].latest=https://github.com/jenesis/jenesis-modules/releases/latest/download/{artifactId}.pom
maven[build.jenesis.crawler].suffixes=none
sources[build.jenesis.crawler]=https://github.com/jenesis/jenesis-modules/archive/refs/tags/v{version}.zip
module[build.jenesis.repository.*]=https://github.com/jenesis/jenesis-repository/releases/download/v{version}/{module}-{version}{-classifier}.{type}
module[build.jenesis.repository.*].latest=https://github.com/jenesis/jenesis-repository/releases/latest/download/{module}.jar
module[build.jenesis.repository.*].suffixes=none
maven[build.jenesis.repository.*]=https://github.com/jenesis/jenesis-repository/releases/download/v{version}/{artifactId}-{version}{-classifier}.{type}
maven[build.jenesis.repository.*].latest=https://github.com/jenesis/jenesis-repository/releases/latest/download/{artifactId}.pom
maven[build.jenesis.repository.*].suffixes=none
sources[build.jenesis.repository.*]=https://github.com/jenesis/jenesis-repository/archive/refs/tags/v{version}.zip
